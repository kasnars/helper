server {
    listen 80;
    server_name _;

    location = / {
        return 302 /helper/;
    }

    location /helper/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /helper/index.html;
    }

    location /helper/assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
